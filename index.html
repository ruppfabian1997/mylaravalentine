<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen im Valentinstags-Zoo 💝</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe4f1 50%, #ffd6e8 100%);
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        #counter {
            position: absolute;
            top: 80px;
            left: 20px;
            transform: none;
            z-index: 10;
            pointer-events: none;
        }
        #hint {
            position: absolute;
            top: 190px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: auto;
        }
        #photo-pop {
            position: absolute;
            left: 250px;
            top: 55%;
            transform: translateY(-50%) scale(0.8);
            opacity: 0;
            z-index: 11;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #photo-pop.show {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }
        #photo-pop img {
            width: 190px;
            max-width: 40vw;
            border-radius: 18px;
            border: 6px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        #confetti-layer {
            position: absolute;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 14px;
            border-radius: 3px;
            opacity: 0.9;
            animation: confetti-fall 2.6s ease-in forwards;
        }
        @keyframes confetti-fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
            }
            100% {
                transform: translateY(105vh) rotate(520deg);
            }
        }
        .runaway-button {
            position: relative;
        }
        .pump {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .pump:hover {
            transform: scale(1.1);
        }
        .pump:active {
            transform: scale(0.95);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-float 2s ease-out forwards;
        }
        @keyframes particle-float {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="title">
        <h1 class="text-4xl md:text-6xl font-bold text-pink-600 drop-shadow-lg">
            Willkommen auf Lara's Valentinstags-Hof 🐼💕
        </h1>
    </div>
    <div id="counter">
        <p class="text-lg md:text-xl font-bold text-pink-500 bg-white bg-opacity-70 px-4 py-2 rounded-full shadow-lg">
            Klicks: <span id="click-count">0</span> / 15
        </p>
    </div>
    <div id="hint">
        <p id="hint-text" class="text-lg md:text-xl font-bold text-pink-600 bg-white bg-opacity-70 px-5 py-2 rounded-full shadow-lg">
            Der Panda ist traurig, weil er Lara an Valentistag nicht sehen kann :( Könntest du ihm helfen?
        </p>
        <div class="mt-3 flex items-center justify-center gap-3">
            <button id="yes-button" class="px-4 py-2 text-sm md:text-base font-bold rounded-full shadow-lg bg-white text-pink-600 hover:bg-pink-50 transition">
                JA
            </button>
            <button id="no-button" class="runaway-button px-4 py-2 text-sm md:text-base font-bold rounded-full shadow-lg bg-white text-pink-600 hover:bg-pink-50 transition">
                Nein
            </button>
        </div>
    </div>
    <div id="photo-pop">
        <img src="data/IMG_7859.png" alt="Foto von euch beiden" />
    </div>
    <div id="confetti-layer"></div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcfefff);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;
        camera.position.y = 1;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Create Zoo environment
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x88c96b });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.2;
        scene.add(ground);

        const pathGeometry = new THREE.PlaneGeometry(16, 6);
        const pathMaterial = new THREE.MeshPhongMaterial({ color: 0xe7c59c });
        const path = new THREE.Mesh(pathGeometry, pathMaterial);
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, -1.18, 4);
        scene.add(path);

        const fenceGroup = new THREE.Group();
        const postGeometry = new THREE.BoxGeometry(0.15, 1.2, 0.15);
        const railGeometry = new THREE.BoxGeometry(8, 0.12, 0.12);
        const fenceMaterial = new THREE.MeshPhongMaterial({ color: 0xd6a16a });

        for (let i = -4; i <= 4; i++) {
            const post = new THREE.Mesh(postGeometry, fenceMaterial);
            post.position.set(i * 1, -0.6, -4);
            fenceGroup.add(post);
        }

        const topRail = new THREE.Mesh(railGeometry, fenceMaterial);
        topRail.position.set(0, -0.2, -4);
        fenceGroup.add(topRail);

        const midRail = new THREE.Mesh(railGeometry, fenceMaterial);
        midRail.position.set(0, -0.6, -4);
        fenceGroup.add(midRail);

        scene.add(fenceGroup);

        const treeGroup = new THREE.Group();
        const trunkGeometry = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 12);
        const trunkMaterial = new THREE.MeshPhongMaterial({ color: 0x8b5a2b });
        const leavesGeometry = new THREE.SphereGeometry(0.6, 16, 16);
        const leavesMaterial = new THREE.MeshPhongMaterial({ color: 0x4caf50 });

        const treePositions = [
            new THREE.Vector3(-6, -0.2, -2),
            new THREE.Vector3(6, -0.2, -1),
            new THREE.Vector3(-7, -0.2, 3)
        ];

        treePositions.forEach((pos) => {
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.set(pos.x, pos.y, pos.z);
            treeGroup.add(trunk);

            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.set(pos.x, pos.y + 0.8, pos.z);
            treeGroup.add(leaves);
        });

        scene.add(treeGroup);

        const cloudGroup = new THREE.Group();
        const cloudMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const cloudPositions = [
            new THREE.Vector3(-4, 4, -6),
            new THREE.Vector3(3, 4.5, -5),
            new THREE.Vector3(7, 3.8, -7)
        ];

        cloudPositions.forEach((pos) => {
            const puff1 = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 12), cloudMaterial);
            const puff2 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 12), cloudMaterial);
            const puff3 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), cloudMaterial);
            puff1.position.set(pos.x, pos.y, pos.z);
            puff2.position.set(pos.x + 0.7, pos.y + 0.1, pos.z + 0.2);
            puff3.position.set(pos.x - 0.7, pos.y - 0.1, pos.z - 0.1);
            cloudGroup.add(puff1, puff2, puff3);
        });

        scene.add(cloudGroup);

        const sunGeometry = new THREE.SphereGeometry(0.9, 16, 16);
        const sunMaterial = new THREE.MeshPhongMaterial({ color: 0xfff4a3, emissive: 0xfff4a3, emissiveIntensity: 0.6 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(-7, 5, -8);
        scene.add(sun);

        // Create Panda
        const pandaGroup = new THREE.Group();
        
        // Panda body
        const bodyGeometry = new THREE.SphereGeometry(1, 32, 32);
        const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xf5f5f5 });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.scale.set(1, 1.2, 1);
        pandaGroup.add(body);
        
        // Panda head
        const headGeometry = new THREE.SphereGeometry(0.7, 32, 32);
        const head = new THREE.Mesh(headGeometry, bodyMaterial);
        head.position.y = 1.5;
        pandaGroup.add(head);
        
        // Panda ears (black)
        const earMaterial = new THREE.MeshPhongMaterial({ color: 0x000000 });
        const earGeometry = new THREE.SphereGeometry(0.25, 16, 16);
        
        const leftEar = new THREE.Mesh(earGeometry, earMaterial);
        leftEar.position.set(-0.5, 2, 0);
        pandaGroup.add(leftEar);
        
        const rightEar = new THREE.Mesh(earGeometry, earMaterial);
        rightEar.position.set(0.5, 2, 0);
        pandaGroup.add(rightEar);
        
        // Panda eyes (black patches)
        const eyePatchGeometry = new THREE.SphereGeometry(0.2, 16, 16);
        
        const leftEyePatch = new THREE.Mesh(eyePatchGeometry, earMaterial);
        leftEyePatch.position.set(-0.25, 1.6, 0.6);
        leftEyePatch.scale.set(1, 1.2, 0.5);
        pandaGroup.add(leftEyePatch);
        
        const rightEyePatch = new THREE.Mesh(eyePatchGeometry, earMaterial);
        rightEyePatch.position.set(0.25, 1.6, 0.6);
        rightEyePatch.scale.set(1, 1.2, 0.5);
        pandaGroup.add(rightEyePatch);
        
        // Panda eyes
        const eyeMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const eyeGeometry = new THREE.SphereGeometry(0.08, 16, 16);
        
        const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        leftEye.position.set(-0.25, 1.55, 0.65);
        pandaGroup.add(leftEye);
        
        const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        rightEye.position.set(0.25, 1.55, 0.65);
        pandaGroup.add(rightEye);
        
        const mouthMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 });

        function createHappyMouth() {
            const mouthCurve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-0.15, 1.25, 0.65),
                new THREE.Vector3(0, 1.35, 0.7),
                new THREE.Vector3(0.15, 1.25, 0.65)
            );
            const mouthPoints = mouthCurve.getPoints(20);
            const mouthGeometry = new THREE.BufferGeometry().setFromPoints(mouthPoints);
            return new THREE.Line(mouthGeometry, mouthMaterial);
        }

        function createSadMouth() {
            const mouthCurve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-0.15, 1.3, 0.65),
                new THREE.Vector3(0, 1.2, 0.7),
                new THREE.Vector3(0.15, 1.3, 0.65)
            );
            const mouthPoints = mouthCurve.getPoints(20);
            const mouthGeometry = new THREE.BufferGeometry().setFromPoints(mouthPoints);
            return new THREE.Line(mouthGeometry, mouthMaterial);
        }

        let mouthLine = createHappyMouth();
        pandaGroup.add(mouthLine);
        
        // Panda nose
        const noseGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const nose = new THREE.Mesh(noseGeometry, earMaterial);
        nose.position.set(0, 1.4, 0.7);
        nose.scale.set(0.8, 0.6, 0.5);
        pandaGroup.add(nose);
        
        pandaGroup.position.set(-3, 0, 0);
        scene.add(pandaGroup);

        // Create collapsed Heart
        const heartShape = new THREE.Shape();
        heartShape.moveTo(0, 0);
        heartShape.bezierCurveTo(0, -0.3, -0.6, -0.3, -0.6, 0);
        heartShape.bezierCurveTo(-0.6, 0.3, 0, 0.8, 0, 1);
        heartShape.bezierCurveTo(0, 0.8, 0.6, 0.3, 0.6, 0);
        heartShape.bezierCurveTo(0.6, -0.3, 0, -0.3, 0, 0);
        
        const extrudeSettings = {
            depth: 0.3,
            bevelEnabled: true,
            bevelThickness: 0.1,
            bevelSize: 0.1,
            bevelSegments: 5
        };
        
        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        const heartMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xffb3d9,
            shininess: 50
        });
        const heart = new THREE.Mesh(heartGeometry, heartMaterial);
        heart.position.set(2, 0, 0);
        heart.rotation.z = Math.PI;
        heart.scale.set(0.5, 0.3, 0.5); // Collapsed state
        scene.add(heart);

        // Create Pump
        const pumpGroup = new THREE.Group();
        const pumpRedMaterial = new THREE.MeshPhongMaterial({ color: 0xd94b3d, shininess: 70 });
        const pumpDarkRedMaterial = new THREE.MeshPhongMaterial({ color: 0xb23b30, shininess: 50 });
        const pumpMetalMaterial = new THREE.MeshPhongMaterial({ color: 0xbfc7d1, shininess: 120 });
        const pumpRubberMaterial = new THREE.MeshPhongMaterial({ color: 0x1f1f1f, shininess: 10 });
        const pumpWoodMaterial = new THREE.MeshPhongMaterial({ color: 0xc28b58, shininess: 30 });

        // Pump base plate
        const basePlateGeometry = new THREE.CylinderGeometry(0.45, 0.45, 0.08, 32);
        const basePlate = new THREE.Mesh(basePlateGeometry, pumpRubberMaterial);
        basePlate.position.y = -2.05;
        pumpGroup.add(basePlate);

        // Foot pedal
        const footGeometry = new THREE.BoxGeometry(0.7, 0.08, 0.25);
        const foot = new THREE.Mesh(footGeometry, pumpRubberMaterial);
        foot.position.set(0, -2.02, 0.22);
        pumpGroup.add(foot);

        // Pump body
        const pumpBodyGeometry = new THREE.CylinderGeometry(0.25, 0.28, 1.6, 32);
        const pumpBody = new THREE.Mesh(pumpBodyGeometry, pumpRedMaterial);
        pumpBody.position.y = -1.2;
        pumpGroup.add(pumpBody);

        // Pump body ring
        const bodyRingGeometry = new THREE.TorusGeometry(0.27, 0.03, 12, 32);
        const bodyRing = new THREE.Mesh(bodyRingGeometry, pumpDarkRedMaterial);
        bodyRing.rotation.x = Math.PI / 2;
        bodyRing.position.y = -0.45;
        pumpGroup.add(bodyRing);

        // Pump top cap
        const pumpTopGeometry = new THREE.CylinderGeometry(0.22, 0.24, 0.18, 24);
        const pumpTop = new THREE.Mesh(pumpTopGeometry, pumpDarkRedMaterial);
        pumpTop.position.y = -0.35;
        pumpGroup.add(pumpTop);

        // Pump handle group (moves)
        const pumpHandle = new THREE.Group();

        const shaftGeometry = new THREE.CylinderGeometry(0.08, 0.08, 1.7, 20);
        const shaft = new THREE.Mesh(shaftGeometry, pumpMetalMaterial);
        shaft.position.y = 0.35;
        pumpHandle.add(shaft);

        const gripGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 16);
        const grip = new THREE.Mesh(gripGeometry, pumpWoodMaterial);
        grip.rotation.z = Math.PI / 2;
        grip.position.y = 1.25;
        pumpHandle.add(grip);

        const gripEndGeometry = new THREE.SphereGeometry(0.12, 16, 16);
        const gripLeft = new THREE.Mesh(gripEndGeometry, pumpWoodMaterial);
        gripLeft.position.set(-0.4, 1.25, 0);
        pumpHandle.add(gripLeft);

        const gripRight = new THREE.Mesh(gripEndGeometry, pumpWoodMaterial);
        gripRight.position.set(0.4, 1.25, 0);
        pumpHandle.add(gripRight);

        pumpHandle.position.y = -1.0;
        pumpGroup.add(pumpHandle);

        // Pump nozzle
        const nozzleGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.45, 12);
        const nozzle = new THREE.Mesh(nozzleGeometry, pumpMetalMaterial);
        nozzle.rotation.z = Math.PI / 2;
        nozzle.position.set(0.42, -1.65, 0);
        pumpGroup.add(nozzle);

        pumpGroup.position.set(3.2, -0.2, 0.8);
        scene.add(pumpGroup);

        // Hose connecting pump to heart
        const hoseCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(3.6, -1.8, 0.8),
            new THREE.Vector3(3.0, -1.4, 0.4),
            new THREE.Vector3(2.6, -0.6, 0.2),
            new THREE.Vector3(2.3, -0.2, 0.1)
        ]);
        const hoseGeometry = new THREE.TubeGeometry(hoseCurve, 40, 0.06, 10, false);
        const hoseMaterial = new THREE.MeshPhongMaterial({ color: 0xff6f9f });
        const hose = new THREE.Mesh(hoseGeometry, hoseMaterial);
        scene.add(hose);

        const heartConnectorGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 12);
        const heartConnector = new THREE.Mesh(heartConnectorGeometry, hoseMaterial);
        heartConnector.rotation.z = Math.PI / 2;
        heartConnector.position.set(2.35, -0.15, 0.1);
        scene.add(heartConnector);

        // Click interaction
        let clickCount = 0;
        const maxClicks = 15;
        let isAnimating = false;
        let completed = false;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const hintText = document.getElementById('hint-text');
        const yesButton = document.getElementById('yes-button');
        const noButton = document.getElementById('no-button');
        const photoPop = document.getElementById('photo-pop');
        const confettiLayer = document.getElementById('confetti-layer');
        const originalHintText = 'Bitte pumpe das Herz auf, damit der Panda glücklich ist';

        function moveNoButton() {
            const rect = noButton.getBoundingClientRect();
            const padding = 16;
            const minX = padding - rect.left;
            const maxX = window.innerWidth - rect.right - padding;
            const minY = padding - rect.top;
            const maxY = window.innerHeight - rect.bottom - padding;
            const rangeX = maxX - minX;
            const rangeY = maxY - minY;
            const offsetX = rangeX <= 0 ? 0 : Math.random() * rangeX + minX;
            const offsetY = rangeY <= 0 ? 0 : Math.random() * rangeY + minY;

            noButton.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        }

        function launchConfetti() {
            const colors = ['#ff6f9f', '#ffd166', '#f25c54', '#9bdeac', '#8ecae6'];
            const pieces = 45;

            for (let i = 0; i < pieces; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = `${2 + Math.random() * 1.2}s`;
                piece.style.transform = `translateY(-10px) rotate(${Math.random() * 180}deg)`;
                confettiLayer.appendChild(piece);

                piece.addEventListener('animationend', () => {
                    piece.remove();
                });
            }
        }

        yesButton.addEventListener('click', () => {
            hintText.textContent = originalHintText;
        });

        noButton.addEventListener('mouseenter', moveNoButton);
        noButton.addEventListener('focus', moveNoButton);
        noButton.addEventListener('touchstart', moveNoButton);

        function onPumpClick(event) {
            if (completed || isAnimating) return;
            
            // Calculate mouse position
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pumpGroup.children);
            
            if (intersects.length > 0) {
                clickCount++;
                document.getElementById('click-count').textContent = clickCount;
                
                // Animate pump
                animatePump();
                
                // Grow heart
                const scale = 0.5 + (clickCount / maxClicks) * 1.5;
                const scaleY = 0.3 + (clickCount / maxClicks) * 1.7;
                heart.scale.set(scale, scaleY, scale);
                
                // Change heart color as it grows
                const hue = 0.92 - (clickCount / maxClicks) * 0.05;
                heart.material.color.setHSL(hue, 0.8, 0.7);
                
                if (clickCount >= maxClicks) {
                    completeAnimation();
                }
            }
        }

        function animatePump() {
            isAnimating = true;
            const originalY = pumpHandle.position.y;
            
            // Pump down
            gsap.to(pumpHandle.position, {
                y: originalY - 0.3,
                duration: 0.1,
                onComplete: () => {
                    // Pump up
                    gsap.to(pumpHandle.position, {
                        y: originalY,
                        duration: 0.1,
                        onComplete: () => {
                            isAnimating = false;
                        }
                    });
                }
            });
        }

        function completeAnimation() {
            completed = true;
            
            // Float heart up
            const heartFloatInterval = setInterval(() => {
                heart.position.y += 0.02;
                heart.rotation.y += 0.02;
            }, 16);
            
            setTimeout(() => clearInterval(heartFloatInterval), 3000);
            
            // Make panda sad
            pandaGroup.remove(mouthLine);
            mouthLine = createSadMouth();
            pandaGroup.add(mouthLine);
            
            // Particle effects
            createParticles();
            photoPop.classList.add('show');
            launchConfetti();
            
            // Panda jump
            let pandaJump = 0;
            const pandaJumpInterval = setInterval(() => {
                pandaJump += 0.1;
                pandaGroup.position.y = Math.sin(pandaJump) * 0.3;
            }, 50);
            
            setTimeout(() => {
                clearInterval(pandaJumpInterval);
                pandaGroup.position.y = 0;
            }, 2000);
        }

        function createParticles() {
            const colors = [0xffb3d9, 0xffc0cb, 0xff69b4, 0xffd700, 0xff1493];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                    const particleMaterial = new THREE.MeshPhongMaterial({ 
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                    const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                    
                    particle.position.set(
                        heart.position.x + (Math.random() - 0.5) * 2,
                        heart.position.y + (Math.random() - 0.5) * 2,
                        heart.position.z + (Math.random() - 0.5) * 2
                    );
                    
                    scene.add(particle);
                    
                    // Animate particle
                    const tx = (Math.random() - 0.5) * 5;
                    const ty = (Math.random() - 0.5) * 5;
                    const tz = (Math.random() - 0.5) * 5;
                    
                    const particleInterval = setInterval(() => {
                        particle.position.x += tx * 0.02;
                        particle.position.y += ty * 0.02;
                        particle.position.z += tz * 0.02;
                        particle.scale.multiplyScalar(0.95);
                    }, 16);
                    
                    setTimeout(() => {
                        clearInterval(particleInterval);
                        scene.remove(particle);
                    }, 2000);
                }, i * 40);
            }
        }

        // Simple animation library (GSAP-like)
        const gsap = {
            to: (target, options) => {
                const startValues = {};
                for (let key in options) {
                    if (key !== 'duration' && key !== 'onComplete' && typeof options[key] === 'number') {
                        startValues[key] = target[key];
                    }
                }
                
                const startTime = Date.now();
                const duration = (options.duration || 1) * 1000;
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    for (let key in options) {
                        if (key !== 'duration' && key !== 'onComplete' && typeof options[key] === 'number') {
                            target[key] = startValues[key] + (options[key] - startValues[key]) * progress;
                        }
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else if (options.onComplete) {
                        options.onComplete();
                    }
                };
                
                animate();
            }
        };

        // Event listeners
        window.addEventListener('click', onPumpClick);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Gentle rotation
            if (!completed) {
                heart.rotation.y += 0.005;
                pandaGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
            }
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
